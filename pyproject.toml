[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarprio"
version = "0.2.0"
description = "Priority-based solar surplus routing engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
runtime = ["paho-mqtt>=2.0"]
dev = ["pytest", "paho-mqtt>=2.0", "amqtt"]

[project.scripts]
solarprio = "solarprio.runtime.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
