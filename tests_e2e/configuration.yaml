homeassistant:
  name: Test
  unit_system: metric
  time_zone: Europe/Paris
  latitude: 48.85
  longitude: 2.35
http:
  server_port: 8123
frontend:
onboarding:
input_number:
  bat_charge:
    name: Battery charge setpoint
    min: 0
    max: 3000
    step: 1
    initial: 0
    unit_of_measurement: W
  bat_soc:
    name: Battery SoC
    min: 0
    max: 100
    step: 1
    initial: 50
    unit_of_measurement: "%"
  ev_current:
    name: EV current
    min: 0
    max: 32
    step: 1
    initial: 0
    unit_of_measurement: A
  car_soc:
    name: Car SoC
    min: 0
    max: 100
    step: 1
    initial: 30
    unit_of_measurement: "%"
  grid:
    name: Grid
    min: -10000
    max: 10000
    step: 1
    initial: 0
    unit_of_measurement: W
  dimmer:
    name: Dimmer
    min: 0
    max: 100
    step: 1
    initial: 0
input_boolean:
  ev_switch:
    name: EV charger switch
  car_plugged:
    name: Car plugged
    initial: true
  pump:
    name: Pump
  server:
    name: Server
template:
  - sensor:
      - name: Grid Power
        unique_id: grid_power_test
        unit_of_measurement: W
        device_class: power
        state: "{{ states('input_number.grid') | float(0) }}"
